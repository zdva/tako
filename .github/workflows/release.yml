name: Release

# Push a tag such as v0.4.0 to build every platform and attach the installers,
# the signed update manifests and SHA256SUMS to a DRAFT GitHub release.
# Nothing is published until a person reviews the draft and publishes it.
#
# Secret needed (Settings > Secrets and variables > Actions):
#   MYGO_UPDATER_PRIVATE_KEY  the contents of mygo-update.key, the ed25519 key
#                             that signs updates (`go tool mygo keygen`). The
#                             matching public key is updates.publicKey in
#                             mygo.json. No Apple or Windows certificate is
#                             used: the builds are unsigned (docs/RELEASE.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  check:
    name: check version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tag matches mygo.json and CHANGELOG
        run: |
          version="$(jq -r .version mygo.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match mygo.json version $version" >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - name: Update key is set
        env:
          KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: test -n "$KEY" || { echo "the MYGO_UPDATER_PRIVATE_KEY secret is not set" >&2; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make vuln

  draft-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The dmg needs macOS; the NSIS installer needs makensis.
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build and upload (unsigned installers, signed updates)
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
      - name: Build the .rpm packages with nfpm
        if: matrix.name == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          version="$(jq -r .version mygo.json)"
          for pair in amd64:x86_64 arm64:aarch64; do
            export ARCH="${pair%%:*}" RPM_ARCH="${pair##*:}" VERSION="$version"
            sed -e "s/\${ARCH}/$ARCH/g" -e "s/\${RPM_ARCH}/$RPM_ARCH/g" -e "s/\${VERSION}/$VERSION/g" \
              packaging/nfpm.yaml.tmpl > build/nfpm.yaml
            nfpm package -p rpm -f build/nfpm.yaml -t build/
          done
          gh release upload "$GITHUB_REF_NAME" build/*.rpm --clobber

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS of every installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.exe' --pattern '*.deb' --pattern '*.rpm' --pattern '*.tar.gz'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
