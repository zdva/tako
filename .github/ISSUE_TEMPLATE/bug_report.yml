name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, private keys or logs with hostnames you want to keep private.
        For security problems, see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Tako version
      description: Output of `tako -version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Server, auth method, jump/proxy setup (if connection related)
